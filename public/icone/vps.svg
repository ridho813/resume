<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="vps-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="vps-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="vps-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Top Server Chassis -->
  <rect x="14" y="22" width="100" height="38" rx="8" fill="url(#vps-dark)" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="26" y1="35" x2="60" y2="35" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="26" y1="47" x2="60" y2="47" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="78" cy="41" r="4" fill="#10B981" filter="url(#vps-glow)"/>
  <circle cx="91" cy="41" r="4" fill="#38BDF8" filter="url(#vps-glow)"/>
  <circle cx="104" cy="41" r="3" fill="#64748B"/>

  <!-- Server Connection Nodes -->
  <line x1="42" y1="60" x2="42" y2="68" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="86" y1="60" x2="86" y2="68" stroke="#38BDF8" stroke-width="2.5"/>

  <!-- Bottom Server Chassis -->
  <rect x="14" y="68" width="100" height="38" rx="8" fill="url(#vps-dark)" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="26" y1="81" x2="60" y2="81" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="26" y1="93" x2="60" y2="93" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="78" cy="87" r="4" fill="#10B981" filter="url(#vps-glow)"/>
  <circle cx="91" cy="87" r="4" fill="#F59E0B" filter="url(#vps-glow)"/>
  <circle cx="104" cy="87" r="3" fill="#64748B"/>

  <!-- Stand Feet -->
  <rect x="28" y="107" width="16" height="5" rx="2.5" fill="#475569"/>
  <rect x="84" y="107" width="16" height="5" rx="2.5" fill="#475569"/>

  <!-- VPS Tag Badge -->
  <g transform="translate(72, 8)">
    <rect width="44" height="20" rx="6" fill="url(#vps-blue)"/>
    <text x="22" y="14.5" fill="#FFFFFF" font-size="11" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.8">VPS</text>
  </g>
</svg>
